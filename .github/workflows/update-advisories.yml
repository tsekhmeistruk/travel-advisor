name: Update advisories

# Refreshes U.S. and Canadian advisories once a day at a random time.
# GitHub cron can't randomise, so a cheap "gate" job runs hourly and only lets the
# update through once per UTC day: at a pseudo-random hour picked from the date,
# plus a random 0–39 minute wait. Later hours catch up if a run was delayed, dropped
# or failed; hours 22–23 UTC are never picked, so they're always spare catch-up slots.

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:   # "Run workflow" button: updates immediately, no wait

permissions:
  contents: write

concurrency:
  group: update-advisories
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
      jitter: ${{ steps.decide.outputs.jitter }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: data/last-run.txt
          sparse-checkout-cone-mode: false

      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          SEED: ${{ github.repository }}
        run: |
          today=$(date -u +%F)
          hour=$(date -u +%-H)
          last=$(cat data/last-run.txt 2>/dev/null || echo never)
          target=$(( 0x$(printf '%s' "$today-$SEED" | sha256sum | cut -c1-8) % 22 ))

          run=false; jitter=false
          if [ "$EVENT" = "workflow_dispatch" ]; then
            run=true; why="manual run"
          elif [ "$last" = "$today" ]; then
            why="already updated today"
          elif [ "$hour" -lt "$target" ]; then
            why="today's slot is ${target}:xx UTC"
          else
            run=true
            # Only the on-time run waits a random time; catch-up runs go straight away.
            if [ "$hour" -eq "$target" ]; then jitter=true; why="today's slot"; else why="catching up"; fi
          fi

          echo "now ${hour}:xx UTC, slot ${target}:xx UTC, last run: ${last} -> run=${run} (${why})" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "jitter=$jitter" >> "$GITHUB_OUTPUT"

  update:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      pushed: ${{ steps.commit.outputs.pushed }}
    steps:
      - name: Wait a random time
        if: needs.gate.outputs.jitter == 'true'
        run: |
          minutes=$(( RANDOM % 40 ))
          echo "Waiting ${minutes} min"
          sleep $(( minutes * 60 ))

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Fetch U.S. advisories
        id: us
        continue-on-error: true
        run: node scripts/fetch-us.mjs

      - name: Fetch Canadian advisories
        id: ca
        continue-on-error: true
        run: node scripts/fetch-canada.mjs

      # Builds with whatever is available; a failed source keeps its previous snapshot.
      - name: Build site data
        id: build
        continue-on-error: true
        run: node scripts/build-data.mjs

      # Table of this run's requests and results on the run's summary page.
      - name: Summarize fetch results
        if: always()
        run: node scripts/log-summary.mjs >> "$GITHUB_STEP_SUMMARY"

      # Runs even after a failure, so the fetch log records it.
      - name: Commit and push
        id: commit
        if: always()
        env:
          US: ${{ steps.us.outcome }}
          CA: ${{ steps.ca.outcome }}
          BUILD: ${{ steps.build.outcome }}
        run: |
          # Mark today done only if everything succeeded, so a failure retries next hour.
          if [ "$US" = "success" ] && [ "$CA" = "success" ] && [ "$BUILD" = "success" ]; then
            date -u +%F > data/last-run.txt
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data logs
          if git diff --cached --quiet; then echo "No changes to commit"; exit 0; fi
          git commit -m "Update advisories $(date -u +%F)"
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Report failures
        if: steps.us.outcome == 'failure' || steps.ca.outcome == 'failure' || steps.build.outcome == 'failure'
        run: |
          echo "::error::U.S. fetch: ${{ steps.us.outcome }}, Canada fetch: ${{ steps.ca.outcome }}, build: ${{ steps.build.outcome }}. Failed sources kept their previous data; the next hourly run will retry. See the Fetch results table above and logs/fetch/."
          exit 1

  # New data goes live only if all tests pass on it. Runs even when one source failed,
  # so the other source's update still ships.
  deploy:
    needs: update
    if: always() && needs.update.outputs.pushed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      ref: main
