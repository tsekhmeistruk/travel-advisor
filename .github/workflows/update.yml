name: Update data

# Runs hourly and fetches whatever is due (config/schedule.json, rules in scripts/lib/schedule.mjs):
#   - travel advisories (us, ca, nl, uk, de): once per UTC day, at a pseudo-random hour picked from the
#     date, so the rate-limited U.S. API isn't called at the same time every day; later hours
#     catch up if a fetch failed or a run was skipped, and hours 22–23 UTC are spare
#   - GDACS disaster alerts: every hour
#   - WHO Disease Outbreak News: every 6 hours
#   - GDELT news reports (daily counts, for unusual activity): checked every 6 hours, one new file a day
#   - UCDP conflict data: checked once a day for a new monthly version (one comes out each month)
#   - Wikipedia: the articles about the wars (who is on each side, a short summary), once a week
#   - USGS earthquakes (M5+, every hour) and NASA EONET volcanoes (every 6 hours): map markers only
# Then it builds, commits, and calls the test-and-deploy workflow. A failed fetch keeps that
# source's previous data; the next run retries it.
#
# GitHub delays and drops scheduled runs under load (the hourly schedule ran about every 6 hours
# on Sep 27, 2026), so it is asked twice an hour. A run with nothing due ends after the due
# check (about 20 s) and commits nothing.

on:
  schedule:
    - cron: '12,42 * * * *'
  workflow_dispatch:   # "Run workflow" button: fetches now, without waiting for a slot
    inputs:
      sources:
        description: 'What to fetch: "all", ids separated by spaces (us ca nl uk de gdacs who gdelt ucdp wikipedia usgs eonet), or "due" (only what is due, like a scheduled run)'
        default: all

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      pushed: ${{ steps.commit.outputs.pushed }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Decide what is due
        id: due
        env:
          EVENT: ${{ github.event_name }}
          SEED: ${{ github.repository }}
          SOURCES: ${{ inputs.sources }}
        run: node scripts/due.mjs

      - name: Fetch GDACS disaster alerts
        id: gdacs
        if: contains(steps.due.outputs.due, ',gdacs,')
        continue-on-error: true
        run: node scripts/fetch.mjs gdacs

      - name: Fetch WHO outbreak news
        id: who
        if: contains(steps.due.outputs.due, ',who,')
        continue-on-error: true
        run: node scripts/fetch.mjs who

      - name: Count GDELT news reports
        id: gdelt
        if: contains(steps.due.outputs.due, ',gdelt,')
        continue-on-error: true
        run: node scripts/fetch.mjs gdelt

      - name: Check UCDP for a new month of conflict data
        id: ucdp
        if: contains(steps.due.outputs.due, ',ucdp,')
        continue-on-error: true
        run: node scripts/fetch.mjs ucdp

      - name: Fetch Wikipedia articles about the wars
        id: wikipedia
        if: contains(steps.due.outputs.due, ',wikipedia,')
        continue-on-error: true
        run: node scripts/fetch.mjs wikipedia

      - name: Fetch USGS earthquakes
        id: usgs
        if: contains(steps.due.outputs.due, ',usgs,')
        continue-on-error: true
        run: node scripts/fetch.mjs usgs

      - name: Fetch NASA EONET volcanoes
        id: eonet
        if: contains(steps.due.outputs.due, ',eonet,')
        continue-on-error: true
        run: node scripts/fetch.mjs eonet

      # Only the on-time daily run waits a random time; catch-up runs go straight away.
      - name: Wait a random time
        if: steps.due.outputs.jitter == 'true'
        run: |
          minutes=$(( RANDOM % 40 ))
          echo "Waiting ${minutes} min"
          sleep $(( minutes * 60 ))

      - name: Fetch U.S. advisories
        id: us
        if: contains(steps.due.outputs.due, ',us,')
        continue-on-error: true
        run: node scripts/fetch.mjs us

      - name: Fetch Canadian advisories
        id: ca
        if: contains(steps.due.outputs.due, ',ca,')
        continue-on-error: true
        run: node scripts/fetch.mjs ca

      - name: Fetch Dutch advisories
        id: nl
        if: contains(steps.due.outputs.due, ',nl,')
        continue-on-error: true
        run: node scripts/fetch.mjs nl

      - name: Fetch UK travel advice
        id: uk
        if: contains(steps.due.outputs.due, ',uk,')
        continue-on-error: true
        run: node scripts/fetch.mjs uk

      - name: Fetch German travel warnings
        id: de
        if: contains(steps.due.outputs.due, ',de,')
        continue-on-error: true
        run: node scripts/fetch.mjs de

      # Builds with whatever is available; a failed source keeps its previous data.
      - name: Build site data
        id: build
        if: steps.due.outputs.any == 'true'
        continue-on-error: true
        run: node scripts/build.mjs

      # Table of this run's requests and results on the run's summary page.
      - name: Summarize fetch results
        if: always() && steps.due.outputs.any == 'true'
        run: node scripts/log-summary.mjs >> "$GITHUB_STEP_SUMMARY"

      # Runs even after a failure, so the fetch log and data/sources-state.json record it.
      - name: Commit and push
        id: commit
        if: always() && steps.due.outputs.any == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data logs site/data
          if git diff --cached --quiet; then echo "No changes to commit"; exit 0; fi
          git commit -m "Update data $(date -u +'%F %H:%M')"
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Report failures
        if: steps.gdacs.outcome == 'failure' || steps.who.outcome == 'failure' || steps.gdelt.outcome == 'failure' || steps.ucdp.outcome == 'failure' || steps.wikipedia.outcome == 'failure' || steps.usgs.outcome == 'failure' || steps.eonet.outcome == 'failure' || steps.us.outcome == 'failure' || steps.ca.outcome == 'failure' || steps.nl.outcome == 'failure' || steps.uk.outcome == 'failure' || steps.de.outcome == 'failure' || steps.build.outcome == 'failure'
        run: |
          echo "::error::GDACS: ${{ steps.gdacs.outcome }}, WHO: ${{ steps.who.outcome }}, GDELT: ${{ steps.gdelt.outcome }}, UCDP: ${{ steps.ucdp.outcome }}, Wikipedia: ${{ steps.wikipedia.outcome }}, USGS: ${{ steps.usgs.outcome }}, EONET: ${{ steps.eonet.outcome }}, U.S.: ${{ steps.us.outcome }}, Canada: ${{ steps.ca.outcome }}, Netherlands: ${{ steps.nl.outcome }}, UK: ${{ steps.uk.outcome }}, Germany: ${{ steps.de.outcome }}, build: ${{ steps.build.outcome }}. Failed sources kept their previous data; the next hourly run retries them. See the Fetch results table above and logs/fetch/."
          exit 1

  # New data goes live only if all tests pass on it. Runs even when one source failed,
  # so the other sources' updates still ship.
  deploy:
    needs: update
    if: always() && needs.update.outputs.pushed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      ref: main
