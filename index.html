<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Travel Risk Map</title>
  <meta name="description" content="World map of U.S. State Department travel advisory levels, highlighting recently updated advisories.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23e0474c'/%3E%3Cpath d='M4 16h24M16 2c5 5 5 23 0 28M16 2c-5 5-5 23 0 28' stroke='white' stroke-width='2' fill='none'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app" id="app">
    <main class="map-area" id="mapArea">
      <svg id="map" role="img" aria-label="World map colored by travel advisory level"></svg>
      <div class="tooltip" id="tooltip" hidden></div>

      <div class="source-toggle" id="sourceToggle" role="radiogroup" aria-label="Advisory source"></div>

      <div class="map-controls" role="group" aria-label="Map zoom">
        <button class="icon-btn" id="zoomIn" title="Zoom in" aria-label="Zoom in">+</button>
        <button class="icon-btn" id="zoomOut" title="Zoom out" aria-label="Zoom out">&minus;</button>
        <button class="icon-btn" id="zoomReset" title="Reset view" aria-label="Reset view">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.3-5.6M4 4v4h4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>

      <div class="legend" id="legend" aria-label="Legend"></div>

      <button class="icon-btn panel-open" id="panelOpen" title="Show panel" aria-label="Show panel" hidden>
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </main>

    <aside class="panel" id="panel" aria-label="Details and settings">
      <header class="panel-header">
        <div>
          <h1>Travel Risk Map</h1>
          <p class="subtle" id="asOf"></p>
        </div>
        <div class="header-actions">
          <button class="icon-btn ghost" id="themeToggle" title="Theme" aria-label="Toggle theme"></button>
          <button class="icon-btn ghost" id="panelClose" title="Hide panel" aria-label="Hide panel">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </header>

      <div class="search">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M20 20l-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input id="search" type="search" placeholder="Find a country" autocomplete="off" aria-label="Find a country" aria-controls="searchResults">
        <ul class="search-results" id="searchResults" role="listbox" hidden></ul>
      </div>

      <section class="card details" id="details" aria-live="polite"></section>

      <section class="section">
        <h2>Settings</h2>
        <div class="setting">
          <span class="setting-label">Risk levels</span>
          <div class="chips" id="levelChips"></div>
        </div>
        <div class="setting">
          <span class="setting-label">Highlight recent updates</span>
          <div class="segmented" id="recentSeg" role="radiogroup" aria-label="Highlight recent updates"></div>
        </div>
        <label class="setting row">
          <span class="setting-label">Fade countries without recent updates</span>
          <span class="switch"><input type="checkbox" id="dimToggle"><span></span></span>
        </label>
      </section>

      <section class="section recent">
        <h2><span id="recentTitle">Recently updated</span> <span class="count" id="recentCount"></span></h2>
        <ul class="recent-list" id="recentList"></ul>
      </section>

      <footer class="panel-footer subtle">
        Levels from the <a id="sourceLink" target="_blank" rel="noopener"></a>.
        Always check the full advisory before you travel.
      </footer>
    </aside>
  </div>

  <script src="vendor/d3.min.js"></script>
  <script src="vendor/topojson-client.min.js"></script>
  <script src="data/world.js"></script>
  <script src="data/advisories.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
