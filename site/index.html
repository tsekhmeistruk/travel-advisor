<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Risk Monitor</title>
  <meta name="description" content="World risk monitor: official travel advisories, disaster and outbreak alerts, and unusual news activity, with recent changes.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23e0474c'/%3E%3Cpath d='M4 16h24M16 2c5 5 5 23 0 28M16 2c-5 5-5 23 0 28' stroke='white' stroke-width='2' fill='none'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- Text comes from i18n/<locale>.json: data-i18n sets text, data-i18n-<attr> sets attributes. -->
  <!-- aria-busy until the first render: the CSS draws a skeleton of the map and card meanwhile. -->
  <div class="app" id="app" aria-busy="true">
    <main class="map-area" id="mapArea">
      <svg id="map" role="img" data-i18n-aria-label="map.label"></svg>
      <div class="tooltip" id="tooltip" hidden></div>

      <!-- On the map: the mode switch, and below it the provider switch (Travel mode). -->
      <div class="map-top" id="mapTop">
        <div class="mode-switch" id="modeSwitch" role="radiogroup" hidden></div>
        <div class="source-toggle" id="providerSwitch" role="radiogroup" hidden></div>
      </div>

      <div class="map-controls" role="group" data-i18n-aria-label="map.controls">
        <button class="icon-btn" id="zoomIn" data-i18n-title="map.zoomIn" data-i18n-aria-label="map.zoomIn">+</button>
        <button class="icon-btn" id="zoomOut" data-i18n-title="map.zoomOut" data-i18n-aria-label="map.zoomOut">&minus;</button>
        <button class="icon-btn" id="zoomReset" data-i18n-title="map.reset" data-i18n-aria-label="map.reset">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.3-5.6M4 4v4h4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>

      <div class="legend" id="legend" data-i18n-aria-label="map.legend"></div>

      <!-- Phones: what was tapped on the map, over the map (the card is below it). -->
      <div class="sheet" id="sheet" role="region" aria-live="polite" data-i18n-aria-label="sheet.label" hidden>
        <div class="sheet-body" id="sheetBody"></div>
        <div class="sheet-actions">
          <button class="sheet-details" id="sheetDetails" data-i18n="sheet.details">Details</button>
          <button class="icon-btn ghost" id="sheetClose" data-i18n-title="sheet.close" data-i18n-aria-label="sheet.close">
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          </button>
        </div>
      </div>

      <button class="icon-btn panel-open" id="panelOpen" data-i18n-title="panel.show" data-i18n-aria-label="panel.show" hidden>
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>

      <p class="load-error" id="loadError" hidden>The map data couldn't be loaded. Please reload the page.</p>
    </main>

    <aside class="panel" id="panel" data-i18n-aria-label="panel.label">
      <header class="panel-header">
        <div>
          <h1 data-i18n="app.title">Risk Monitor</h1>
          <p class="subtle" id="asOf"></p>
        </div>
        <div class="header-actions">
          <button class="icon-btn ghost" id="listOpen" data-i18n-title="panel.list" data-i18n-aria-label="panel.list">
            <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="4.5" cy="6" r="1.4" fill="currentColor"/><circle cx="4.5" cy="12" r="1.4" fill="currentColor"/><circle cx="4.5" cy="18" r="1.4" fill="currentColor"/></svg>
          </button>
          <select class="lang-select" id="language" data-i18n-aria-label="panel.language" data-i18n-title="panel.language" hidden></select>
          <button class="icon-btn ghost" id="themeToggle"></button>
          <button class="icon-btn ghost" id="panelClose" data-i18n-title="panel.hide" data-i18n-aria-label="panel.hide">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </header>

      <div class="search">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M20 20l-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input id="search" type="search" autocomplete="off" aria-controls="searchResults" aria-keyshortcuts="/" data-i18n-placeholder="search.placeholder" data-i18n-aria-label="search.placeholder">
        <ul class="search-results" id="searchResults" role="listbox" hidden></ul>
      </div>

      <section class="card details" id="details" aria-live="polite"></section>

      <section class="country-view" id="countryView" aria-live="polite" hidden></section>
      <section class="country-view list-view" id="listView" hidden></section>

      <section class="section recent">
        <h2><span id="recentTitle"></span> <span class="count" id="recentCount"></span></h2>
        <ul class="recent-list" id="recentList"></ul>
      </section>

      <!-- Unusual news activity now (risk modes without a category): never a level, never a change. -->
      <section class="section recent news" id="newsSection" hidden>
        <h2><span data-i18n="risk.news.title">Unusual news activity</span> <span class="count" id="newsCount"></span></h2>
        <ul class="recent-list news-list" id="newsList"></ul>
        <p class="subtle news-note" data-i18n="risk.news.note"></p>
      </section>

      <details class="section filters" id="filters">
        <summary><h2 data-i18n="panel.filters">Filters</h2></summary>
        <div id="datasetSettings"></div>
      </details>

      <footer class="panel-footer subtle" id="footer"></footer>
    </aside>
  </div>

  <div class="toast" id="toast" role="status" hidden></div>

  <dialog class="help" id="help" aria-labelledby="helpTitle">
    <div class="help-body">
      <div class="help-head">
        <h2 id="helpTitle" data-i18n="help.title">How levels work</h2>
        <form method="dialog"><button class="icon-btn ghost" data-i18n-title="help.close" data-i18n-aria-label="help.close">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button></form>
      </div>
      <p data-i18n="help.intro"></p>
      <dl class="help-levels">
        <div><dt><span class="swatch" style="background:var(--risk-normal)"></span><span data-i18n="risk.levels.1"></span></dt><dd data-i18n="help.levels.1"></dd></div>
        <div><dt><span class="swatch" style="background:var(--l2)"></span><span data-i18n="risk.levels.2"></span></dt><dd data-i18n="help.levels.2"></dd></div>
        <div><dt><span class="swatch" style="background:var(--l3)"></span><span data-i18n="risk.levels.3"></span></dt><dd data-i18n="help.levels.3"></dd></div>
        <div><dt><span class="swatch" style="background:var(--l4)"></span><span data-i18n="risk.levels.4"></span></dt><dd data-i18n="help.levels.4"></dd></div>
      </dl>
      <p data-i18n="help.travel"></p>
      <p data-i18n="help.conflict"></p>
      <p data-i18n="help.confidence"></p>
      <p data-i18n="help.news"></p>
      <p class="subtle" data-i18n="help.ours"></p>
    </div>
  </dialog>

  <script src="vendor/d3.min.js"></script>
  <script src="vendor/topojson-client.min.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
