<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Travel Risk Map</title>
  <meta name="description" content="World map of official travel advisory levels, highlighting recent changes.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23e0474c'/%3E%3Cpath d='M4 16h24M16 2c5 5 5 23 0 28M16 2c-5 5-5 23 0 28' stroke='white' stroke-width='2' fill='none'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- Text comes from i18n/<locale>.json: data-i18n sets text, data-i18n-<attr> sets attributes. -->
  <div class="app" id="app">
    <main class="map-area" id="mapArea">
      <svg id="map" role="img" data-i18n-aria-label="map.label"></svg>
      <div class="tooltip" id="tooltip" hidden></div>

      <div class="source-toggle" id="providerSwitch" role="radiogroup" hidden></div>

      <div class="map-controls" role="group" data-i18n-aria-label="map.controls">
        <button class="icon-btn" id="zoomIn" data-i18n-title="map.zoomIn" data-i18n-aria-label="map.zoomIn">+</button>
        <button class="icon-btn" id="zoomOut" data-i18n-title="map.zoomOut" data-i18n-aria-label="map.zoomOut">&minus;</button>
        <button class="icon-btn" id="zoomReset" data-i18n-title="map.reset" data-i18n-aria-label="map.reset">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.3-5.6M4 4v4h4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>

      <div class="legend" id="legend" data-i18n-aria-label="map.legend"></div>

      <button class="icon-btn panel-open" id="panelOpen" data-i18n-title="panel.show" data-i18n-aria-label="panel.show" hidden>
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>

      <p class="load-error" id="loadError" hidden>The map data couldn't be loaded. Please reload the page.</p>
    </main>

    <aside class="panel" id="panel" data-i18n-aria-label="panel.label">
      <header class="panel-header">
        <div>
          <h1 data-i18n="app.title">Travel Risk Map</h1>
          <p class="subtle" id="asOf"></p>
        </div>
        <div class="header-actions">
          <select class="lang-select" id="language" data-i18n-aria-label="panel.language" data-i18n-title="panel.language" hidden></select>
          <button class="icon-btn ghost" id="themeToggle"></button>
          <button class="icon-btn ghost" id="panelClose" data-i18n-title="panel.hide" data-i18n-aria-label="panel.hide">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </header>

      <div class="segmented mode-switch" id="modeSwitch" role="radiogroup" hidden></div>

      <div class="search">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M20 20l-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input id="search" type="search" autocomplete="off" aria-controls="searchResults" data-i18n-placeholder="search.placeholder" data-i18n-aria-label="search.placeholder">
        <ul class="search-results" id="searchResults" role="listbox" hidden></ul>
      </div>

      <section class="card details" id="details" aria-live="polite"></section>

      <section class="country-view" id="countryView" aria-live="polite" hidden></section>

      <section class="section">
        <h2 data-i18n="panel.settings">Settings</h2>
        <div id="datasetSettings"></div>
      </section>

      <section class="section recent">
        <h2><span id="recentTitle"></span> <span class="count" id="recentCount"></span></h2>
        <ul class="recent-list" id="recentList"></ul>
      </section>

      <footer class="panel-footer subtle" id="footer"></footer>
    </aside>
  </div>

  <script src="vendor/d3.min.js"></script>
  <script src="vendor/topojson-client.min.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
